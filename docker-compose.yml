services:
  hellgalaxy:
    image: ghcr.io/jstplink/hellgalaxydb:latest
    container_name: hellgalaxydb
    restart: unless-stopped
    ports:
      - "8936:8936"
    # Token condiviso con l'agente Unreal (sul PC dell'Editor). Scegli una stringa lunga e casuale e
    # mettila anche nel .env dell'agente (HG_AGENT_TOKEN). Senza, nessun agente può collegarsi.
    # environment:
    #   - HG_AGENT_TOKEN=INCOLLA_QUI_UN_TOKEN_LUNGO
    #   - HG_API_TOKEN=OPZIONALE_TOKEN_UTENTI
    # Volumi gestiti da Docker: sono creati con i permessi giusti, quindi non
    # serve preparare cartelle. Per avere invece i file in una cartella del NAS
    # sostituisci con percorsi tipo /volume1/docker/hellgalaxy/data:/app/data
    # (la cartella deve essere scrivibile dall'utente 1000, o aggiungi 'user:').
    volumes:
      - hellgalaxy-data:/app/data
      - hellgalaxy-images:/app/images

  # Cloudflare Tunnel (opzionale): decommenta e incolla qui il token del tunnel.
  # Nel dashboard Zero Trust il Public Hostname deve puntare a http://hellgalaxy:8936
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: hellgalaxy-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=INCOLLA_QUI_IL_TOKEN
  #   depends_on:
  #     - hellgalaxy

volumes:
  hellgalaxy-data:
  hellgalaxy-images:
